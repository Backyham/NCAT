[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ncat"
version = "0.0.4"
description = "NCAT: local computer-aided subtitle translation toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["starlette>=0.40", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
ncat = "ncat.cli.__main__:main"
ncat-server = "ncat.api.__main__:main"

[tool.setuptools.packages.find]
include = ["ncat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
