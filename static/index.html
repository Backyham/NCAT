<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCAT</title>
<link rel="stylesheet" href="css/app.css">
<!-- Tailwind, vendored rather than pulled from the CDN. This is a
     self-hosted service on the LAN, so a stylesheet that has to leave the
     machine is a dependency that can fail silently and a request that
     should not exist. The utility classes are available for building out
     page contents; app.css styles the shell itself. -->
<script src="vendor/tailwind.js"></script>
</head>
<body>

<div class="shell">

  <!-- ------------------------------------------------------------ sidebar -->
  <nav class="sidebar" id="sidebar" aria-label="Sections">
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">
      <button class="nav-toggle" id="nav-toggle" aria-expanded="true">
        <span class="nav-chevron" id="nav-chevron">‹</span>
        <span class="nav-label">Collapse</span>
      </button>
    </div>
  </nav>

  <div class="column">

    <header class="topbar">
      <h1 class="brand">NCAT</h1>
      <span class="brand-sub">Computer-Aided Translation</span>
      <span class="health" id="health" title="Backend status">checking…</span>
    </header>

    <main class="content" id="content">
      <section class="page" data-page="home"></section>
      <section class="page" data-page="download"></section>
      <section class="page" data-page="transcribe"></section>
      <section class="page" data-page="translate"></section>
      <section class="page" data-page="timeline"></section>
      <section class="page" data-page="export"></section>
    </main>

  </div><!-- /column -->
</div><!-- /shell -->

<script type="module" src="js/main.js"></script>
</body>
</html>
